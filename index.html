<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10141e">
<meta name="description" content="MKKShop과 MKKAPP 웹 프로젝트를 한곳에서 둘러보세요.">
<title>MKKAPP · 앱과 웹 프로젝트</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#10141e;--surface:#191f2d;--line:#353d4e;--text:#f5f6fb;--muted:#bcc5d8;--accent:#c5fb74}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif;word-break:keep-all}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.wrap{width:min(calc(100% - 36px),1040px);margin-inline:auto}
header{border-bottom:1px solid var(--line)}
header .wrap,footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.04em}
.mark{display:grid;place-items:center;width:34px;aspect-ratio:1;background:var(--accent);color:var(--bg);border-radius:10px;font-weight:950}
nav a,.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;min-height:470px;padding-block:52px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.6rem,7.2vw,5.6rem);line-height:1.05;letter-spacing:-.07em}
h1 span{display:block;color:var(--accent)}
.hero p,.project p{margin-top:16px;color:var(--muted)}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:9px 19px;border-radius:12px;background:var(--accent);color:#172215;font-weight:780;margin-top:24px}
.button:hover{background:#e1ffb5}
.art{min-height:280px;display:grid;place-items:center;overflow:hidden;border-radius:28px;border:1px solid #404b42;background:radial-gradient(ellipse at 62% 38%,#3b5332,transparent 65%),#212b27}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;width:min(58%,220px);transform:rotate(-12deg)}
.tile{display:grid;place-items:center;aspect-ratio:1;border:1px solid #829774;border-radius:24%;background:#27392a;color:#daf9bc;font-size:clamp(2rem,6vw,3.6rem);font-weight:850}
.tile:first-child{background:var(--accent);color:#1b2a16;border-color:transparent}
.projects{padding-block:24px 64px;border-top:1px solid var(--line)}
h2{font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.project{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:flex-start}
h3{font-size:1.4rem}
.project p{margin:6px 0 16px;flex:1}
.project a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:5px}
footer{border-top:1px solid var(--line);color:var(--muted)}
@media(max-width:690px){.hero{grid-template-columns:1fr;gap:24px;padding-block:36px}.art{min-height:200px}.tiles{width:142px}.cards{grid-template-columns:1fr}.projects{padding-bottom:40px}}
</style>
</head>
<body id="top">
<header><div class="wrap"><a class="brand" href="#top"><span class="mark" aria-hidden="true">M</span>MKKAPP</a><nav aria-label="주 메뉴"><a href="#projects">프로젝트</a></nav></div></header>
<main class="wrap">
<section class="hero" aria-labelledby="title">
<div><h1 id="title">앱과 웹을 <span>한곳에서.</span></h1><p>MKKShop과 MKKAPP의 웹 프로젝트를 둘러보세요.</p><a class="button" href="#projects">프로젝트 보기</a></div>
<div class="art" aria-hidden="true"><div class="tiles"><div class="tile">M</div><div class="tile">K</div><div class="tile">K</div><div class="tile">+</div></div></div>
</section>
<section class="projects" id="projects" aria-labelledby="projects-title">
<h2 id="projects-title">프로젝트</h2>
<div class="cards">
<article class="project"><h3>MKKShop</h3><p>IT 제품을 둘러보는 쇼핑몰 프로젝트입니다.</p><a href="https://github.com/Joon9979/MKKShop">MKKShop 저장소 보기</a></article>
<article class="project"><h3>테스트 메모</h3><p>짧은 메모를 작성하고 현재 브라우저에 저장해 보세요.</p><a href="./notes.html">테스트 메모 열기</a></article>
</div>
</section>
</main>
<footer><div class="wrap"><strong>MKKAPP</strong><a class="back" href="#top">맨 위로</a></div></footer>
</body>
</html>
