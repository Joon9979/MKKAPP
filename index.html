<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b31">
  <title>MKKAPP</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; color: #111b31; font: 16px/1.6 system-ui, sans-serif; }
    .wrap { width: min(100% - 32px, 780px); margin-inline: auto; }
    header { background: #111b31; color: white; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 66px; gap: 12px; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: .06em; }
    #mode { color: #dbeafe; font-size: 14px; }
    main { padding-block: 32px; }
    section { padding: clamp(20px, 5vw, 36px); background: white; border: 1px solid #dbe4ef; border-radius: 20px; }
    .intro { margin-bottom: 18px; background: #e1ebff; border-color: #d0dfff; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(26px, 5vw, 42px); line-height: 1.2; }
    h2 { font-size: 20px; }
    p { margin-top: 10px; color: #475569; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 8px; }
    input, button { min-height: 44px; border-radius: 10px; font: inherit; }
    input { flex: 1; width: 0; min-width: 0; padding: 8px 12px; border: 1px solid #94a3b8; }
    button { border: 0; padding: 8px 14px; background: #1d4ed8; color: white; cursor: pointer; }
    :focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid #e2e8f0; }
    li span { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
    li button { flex-shrink: 0; color: #334155; background: #edf2f7; }
    #error { color: #a61b1b; }
  </style>
</head>
<body>
  <header><div class="wrap"><span class="brand">MKKAPP</span><span id="mode"></span></div></header>
  <main class="wrap">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">MKKAPP 시작 화면</h1>
      <p id="description"></p>
    </section>
    <section aria-labelledby="notes-title">
      <h2 id="notes-title">테스트 메모</h2>
      <form id="note-form">
        <label for="note">내용</label>
        <div class="row">
          <input id="note" maxlength="200" required>
          <button type="submit">저장</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <p id="error" role="alert" hidden></p>
      <ul id="notes"></ul>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
