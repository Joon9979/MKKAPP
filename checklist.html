<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>체크리스트 | 무꾸웨딩일지</title><style>
:root{--paper:#fbf9f4;--ink:#292820;--mute:#5b584d;--olive:#424a35;--line:#ded9cd;--serif:"Georgia","Nanum Myeongjo","Batang",serif}
*{box-sizing:border-box}

</main><script>
(() => {
  const checklist = document.querySelector('#checklist');
  const boxes = Array.from(checklist.querySelectorAll('input[type=checkbox]'));
  const storageKey = 'mukku.wedding.2027.checklist.v1';
  const note = document.querySelector('#save-note');
  const count = document.querySelector('#check-count');
  const progress = document.querySelector('#check-progress');
  let saved = [];

  function showStorageError() {
    note.textContent = '이 브라우저에서는 새로고침 후 체크 상태를 복원할 수 없어요.';
  }

  try {
    const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (Array.isArray(stored)) saved = stored;
  } catch {
    showStorageError();
  }

  function refreshProgress() {
    const checked = boxes.filter(box => box.checked).map(box => box.id);
    count.textContent = checked.length + ' / ' + boxes.length + ' 완료';
    progress.max = boxes.length;
    progress.value = checked.length;
    for (const group of checklist.querySelectorAll('.check-group')) {
      group.querySelector('.group-count').textContent =
        group.querySelectorAll('input:checked').length + ' / ' + group.querySelectorAll('input').length;
    }
    return checked;
  }

  for (const box of boxes) box.checked = saved.includes(box.id);
  refreshProgress();
  checklist.addEventListener('change', event => {
    if (!boxes.includes(event.target)) return;
    refreshProgress();
    note.textContent = '변경 내용을 적용하려면 저장을 눌러주세요.';
  });

const sharedUrl = 'https://mukku-journal-sync.engagingfairy4.chatgpt.site/checklist';
const sharedButton = document.querySelector('#save-checklist');
let revision = null;

async function loadShared() {
  sharedButton.disabled = true;
  note.textContent = '공용 기록을 불러오는 중이에요.';
  try {
    const response = await fetch(sharedUrl, {cache:'no-store'});
    if (!response.ok) throw new Error();
    const result = await response.json();
    if (!result || !('revision' in result) || (result.data !== null && !Array.isArray(result.data))) throw new Error();
    revision = result.revision;
    if (result.data !== null) {
      for (const box of boxes) box.checked = result.data.includes(box.id);
      refreshProgress();
    }
    note.textContent = result.data === null
      ? '공용 기록이 아직 없어요. 기존 기록이 있는 브라우저에서 먼저 저장하세요.'
      : '최신 공용 기록을 불러왔어요.';
    sharedButton.disabled = false;
  } catch {
    note.textContent = '공용 기록을 불러오지 못했어요. 연결을 확인하고 새로고침해 주세요.';
  }
}
async function save() {
  sharedButton.disabled = true;
  note.textContent = '공용 기록에 저장 중이에요.';
  try {
    const response = await fetch(sharedUrl, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({revision, data:refreshProgress()})
    });
    if (response.status === 409) {
      note.textContent = '다른 사람이 먼저 저장했어요. 변경 내용을 확인한 뒤 새로고침하여 최신 기록을 불러오세요.';
      return;
    }
    if (!response.ok) throw new Error();
    revision = (await response.json()).revision;
    note.textContent = '공용 기록에 저장했어요.';
  } catch {
    note.textContent = '공용 기록을 저장하지 못했어요. 다시 시도해 주세요.';
  } finally {
    sharedButton.disabled = false;
  }
}

  sharedButton.addEventListener('click', save);
  for (const box of boxes) box.disabled = true;
  loadShared().finally(() => {
    for (const box of boxes) box.disabled = false;
  });
})();
</script></body></html>
